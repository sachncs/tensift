---
layout: default
---

<article class="docs-page">
  <header class="docs-header">
    <p class="page-eyebrow">{{ page.section | default: 'Documentation' }}</p>
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.subtitle %}
      <p class="page-subtitle">{{ page.subtitle }}</p>
    {% endif %}
    {% if page.github_path %}
      <p class="docs-edit">
        <a href="{{ site.github_edit_base }}{{ page.github_path }}">Edit this page on GitHub →</a>
      </p>
    {% endif %}
  </header>

  <div class="docs-body">
    {{ content }}
  </div>
</article>
