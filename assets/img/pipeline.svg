<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="The seven-stage tensift pipeline">
  <title>tensift pipeline: lattice construction, basis reduction, CVP, tensor network, sampling, smoothness, factor extraction</title>
  <defs>
    <linearGradient id="pipe-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#D67829" />
      <stop offset="100%" stop-color="#A14A14" />
    </linearGradient>
    <linearGradient id="pipe-rail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#1a1714" stop-opacity="0" />
      <stop offset="8%"  stop-color="#1a1714" stop-opacity="0.7" />
      <stop offset="92%" stop-color="#1a1714" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1a1714" stop-opacity="0" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1714" />
    </marker>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="360" fill="none" />

  <!-- Phase bands (lattice / sampling / algebra) -->
  <g opacity="0.55">
    <rect x="40"  y="40" width="430" height="280" fill="#D67829" fill-opacity="0.04" rx="10" />
    <rect x="490" y="40" width="280" height="280" fill="#1a1714" fill-opacity="0.04" rx="10" />
    <rect x="790" y="40" width="370" height="280" fill="#1a1714" fill-opacity="0.04" rx="10" />
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#92876f">
    <text x="58"  y="64">LATTICE</text>
    <text x="508" y="64">SAMPLING</text>
    <text x="808" y="64">ALGEBRA</text>
  </g>

  <!-- Connecting rails behind nodes -->
  <line x1="120" y1="180" x2="1080" y2="180" stroke="url(#pipe-rail)" stroke-width="1.4" stroke-dasharray="3 4" />

  <!-- N → factors flow line on top -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1a1714">
    <text x="40" y="28" fill="#6a604f">N = p · q</text>
    <text x="1090" y="28" fill="#A14A14" text-anchor="end" font-weight="700">p, q</text>
  </g>
  <line x1="95" y1="32" x2="1115" y2="32" stroke="url(#pipe-accent)" stroke-width="2" />

  <!-- Stage 1: Lattice construction -->
  <g class="node" transform="translate(120 180)">
    <circle r="44" fill="#FFFFFF" stroke="#1a1714" stroke-width="1.4" />
    <!-- small lattice motif: a hexagonal boundary with two vectors meeting at a target -->
    <g fill="none" stroke="#1a1714" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3">
      <polygon points="-22,0  -11,-19   11,-19   22,0  11,19  -11,19" />
      <line x1="-16" y1="-14" x2="16" y2="14" opacity="0.6" />
      <circle cx="0" cy="0" r="1.4" fill="#1a1714" stroke="none" />
      <line x1="0" y1="0" x2="-13" y2="-11" />
      <line x1="0" y1="0" x2="13"  y2="-11" />
    </g>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#A14A14" font-weight="700" text-anchor="middle" y="64">01</text>
  </g>
  <text x="120" y="260" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" font-weight="500" fill="#1a1714">Lattice</text>
  <text x="120" y="278" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" font-weight="500" fill="#1a1714">construction</text>
  <text x="120" y="300" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6a604f">Schnorr basis</text>

  <!-- Stage 2: Basis reduction -->
  <g class="node" transform="translate(280 180)">
    <circle r="44" fill="#FFFFFF" stroke="#1a1714" stroke-width="1.4" />
    <g fill="none" stroke="#1a1714" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3">
      <path d="M-22 16 L-12 -16 L4 -22 L18 -2 L18 18 L0 22 L-16 12 Z" />
      <line x1="-22" y1="16" x2="0" y2="22" />
      <line x1="0" y1="22" x2="18" y2="18" />
    </g>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#A14A14" font-weight="700" text-anchor="middle" y="64">02</text>
  </g>
  <text x="280" y="260" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" font-weight="500" fill="#1a1714">Basis</text>
  <text x="280" y="278" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" font-weight="500" fill="#1a1714">reduction</text>
  <text x="280" y="300" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6a604f">LLL · BKZ</text>

  <!-- Stage 3: CVP baseline -->
  <g class="node" transform="translate(440 180)">
    <circle r="44" fill="#FFFFFF" stroke="#1a1714" stroke-width="1.4" />
    <g fill="none" stroke="#1a1714" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3">
      <circle cx="-8" cy="-8" r="3" fill="#A14A14" stroke="none" />
      <circle cx="14"  cy="6"  r="3" fill="#1a1714" stroke="none" />
      <line x1="-8" y1="-8" x2="14" y2="6" stroke-dasharray="2 2" />
      <line x1="-22" y1="0" x2="22" y2="0" opacity="0.4" />
      <line x1="0" y1="-22" x2="0" y2="22" opacity="0.4" />
    </g>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#A14A14" font-weight="700" text-anchor="middle" y="64">03</text>
  </g>
  <text x="440" y="260" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" font-weight="500" fill="#1a1714">CVP baseline</text>
  <text x="440" y="300" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6a604f">Babai · Klein</text>

  <!-- Stage 4: Tensor network -->
  <g class="node" transform="translate(600 180)">
    <circle r="44" fill="#FFFFFF" stroke="#1a1714" stroke-width="1.4" />
    <g fill="none" stroke="#1a1714" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2">
      <line x1="0" y1="14" x2="-12" y2="0" />
      <line x1="0" y1="14" x2="12"  y2="0" />
      <line x1="-12" y1="0" x2="-18" y2="-14" />
      <line x1="-12" y1="0" x2="-6"  y2="-14" />
      <line x1="12"  y1="0" x2="6"   y2="-14" />
      <line x1="12"  y1="0" x2="18"  y2="-14" />
      <circle cx="-18" cy="-14" r="2" fill="#1a1714" />
      <circle cx="-6"  cy="-14" r="2" fill="#1a1714" />
      <circle cx="6"   cy="-14" r="2" fill="#1a1714" />
      <circle cx="18"  cy="-14" r="2" fill="#1a1714" />
      <circle cx="0" cy="14" r="2.4" fill="#A14A14" />
    </g>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#A14A14" font-weight="700" text-anchor="middle" y="64">04</text>
  </g>
  <text x="600" y="260" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" font-weight="500" fill="#1a1714">Tensor network</text>
  <text x="600" y="300" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6a604f">TTN ansatz</text>

  <!-- Stage 5: Optimization & sampling -->
  <g class="node" transform="translate(760 180)">
    <circle r="44" fill="#FFFFFF" stroke="#1a1714" stroke-width="1.4" />
    <g fill="none" stroke="#1a1714" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3">
      <path d="M-22 14 Q-10 -22 0 -8 T 22 -18" />
      <circle cx="-22" cy="14" r="1.8" fill="#1a1714" />
      <circle cx="0"  cy="-8" r="1.8" fill="#A14A14" />
      <circle cx="22" cy="-18" r="1.8" fill="#1a1714" />
    </g>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#A14A14" font-weight="700" text-anchor="middle" y="64">05</text>
  </g>
  <text x="760" y="260" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" font-weight="500" fill="#1a1714">Optimisation</text>
  <text x="760" y="278" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" font-weight="500" fill="#1a1714">&amp; sampling</text>
  <text x="760" y="300" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6a604f">OPES · MPO</text>

  <!-- Stage 6: Smoothness -->
  <g class="node" transform="translate(920 180)">
    <circle r="44" fill="#FFFFFF" stroke="#1a1714" stroke-width="1.4" />
    <g fill="none" stroke="#1a1714" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3">
      <rect x="-22" y="-2" width="44" height="14" fill="none" />
      <line x1="-12" y1="0" x2="-12" y2="10" />
      <line x1="0"   y1="0" x2="0"   y2="10" />
      <line x1="12"  y1="0" x2="12"  y2="10" />
      <text x="-17" y="9" font-size="6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1a1714" stroke="none" font-weight="700">2</text>
      <text x="-5"  y="9" font-size="6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1a1714" stroke="none" font-weight="700">3</text>
      <text x="7"   y="9" font-size="6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1a1714" stroke="none" font-weight="700">5</text>
    </g>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#A14A14" font-weight="700" text-anchor="middle" y="64">06</text>
  </g>
  <text x="920" y="260" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" font-weight="500" fill="#1a1714">Smoothness</text>
  <text x="920" y="278" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" font-weight="500" fill="#1a1714">verification</text>
  <text x="920" y="300" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6a604f">factor base</text>

  <!-- Stage 7: Factor extraction -->
  <g class="node" transform="translate(1080 180)">
    <circle r="44" fill="#FFFFFF" stroke="#1a1714" stroke-width="1.4" />
    <g fill="none" stroke="#1a1714" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3">
      <text x="-20" y="6" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1a1714" stroke="none" font-weight="700">p</text>
      <text x="6"  y="6" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#A14A14" stroke="none" font-weight="700">q</text>
      <line x1="-6" y1="-12" x2="14" y2="-12" stroke-width="1.5" />
      <circle cx="14" cy="0" r="2" fill="#A14A14" stroke="none" />
    </g>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#A14A14" font-weight="700" text-anchor="middle" y="64">07</text>
  </g>
  <text x="1080" y="260" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" font-weight="500" fill="#1a1714">Factor</text>
  <text x="1080" y="278" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" font-weight="500" fill="#1a1714">extraction</text>
  <text x="1080" y="300" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6a604f">GF(2) · GCD</text>
</svg>
