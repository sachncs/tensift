<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-label="A factorization trace from input semiprime to its two prime factors">
  <title>Factorization trace</title>
  <defs>
    <linearGradient id="hero-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#D67829" />
      <stop offset="100%" stop-color="#A14A14" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1714" stroke-opacity="0.06" stroke-width="0.8" />
    </pattern>
  </defs>

  <!-- Backdrop with subtle grid -->
  <rect width="520" height="520" fill="#F7F4ED" />
  <rect width="520" height="520" fill="url(#grid)" />

  <!-- Title -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#6a604f">
    <text x="40" y="44">FACTORIZATION TRACE</text>
    <text x="40" y="62" font-size="10" fill="#92876f">deterministic · reproducible · auditable</text>
  </g>

  <!-- Top: N = p · q -->
  <g transform="translate(260 130)">
    <rect x="-100" y="-32" width="200" height="64" rx="10" fill="#FFFFFF" stroke="#1a1714" stroke-width="1.2" />
    <text x="0" y="2" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="28" font-weight="500" fill="#1a1714">N = 8 633</text>
    <text x="0" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6a604f">14 bits · semiprime</text>
  </g>

  <!-- Pipeline rail (vertical) -->
  <line x1="260" y1="200" x2="260" y2="430" stroke="#1a1714" stroke-opacity="0.18" stroke-dasharray="3 4" />

  <!-- 7 mini stage ticks (right-aligned numbers) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.6" fill="#92876f">
    <text x="380" y="208">01 LATTICE</text>
    <text x="380" y="232">02 REDUCE</text>
    <text x="380" y="256">03 CVP</text>
    <text x="380" y="280">04 TENSOR</text>
    <text x="380" y="304">05 SAMPLE</text>
    <text x="380" y="328">06 SMOOTH</text>
    <text x="380" y="352">07 EXTRACT</text>
  </g>

  <!-- Stage dots on the rail -->
  <g>
    <circle cx="260" cy="205" r="5" fill="#A14A14" />
    <circle cx="260" cy="229" r="5" fill="#A14A14" />
    <circle cx="260" cy="253" r="5" fill="#A14A14" />
    <circle cx="260" cy="277" r="5" fill="#A14A14" />
    <circle cx="260" cy="301" r="5" fill="#A14A14" />
    <circle cx="260" cy="325" r="5" fill="#A14A14" />
    <circle cx="260" cy="349" r="5" fill="#A14A14" />
  </g>

  <!-- Lattice motif stage 1-3 -->
  <g transform="translate(140 230)" fill="none" stroke="url(#hero-accent)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="-26,0 -13,-22 13,-22 26,0 13,22 -13,22" />
    <line x1="-22" y1="-19" x2="22" y2="19" opacity="0.7" />
    <circle cx="0" cy="0" r="1.6" fill="url(#hero-accent)" stroke="none" />
  </g>

  <!-- Tensor tree motif stage 4-5 -->
  <g transform="translate(140 290)" fill="none" stroke="url(#hero-accent)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="14" x2="-12" y2="0" />
    <line x1="0" y1="14" x2="12"  y2="0" />
    <line x1="-12" y1="0" x2="-18" y2="-14" />
    <line x1="-12" y1="0" x2="-6"  y2="-14" />
    <line x1="12"  y1="0" x2="6"   y2="-14" />
    <line x1="12"  y1="0" x2="18"  y2="-14" />
    <circle cx="-18" cy="-14" r="1.6" fill="url(#hero-accent)" stroke="none" />
    <circle cx="-6"  cy="-14" r="1.6" fill="url(#hero-accent)" stroke="none" />
    <circle cx="6"   cy="-14" r="1.6" fill="url(#hero-accent)" stroke="none" />
    <circle cx="18"  cy="-14" r="1.6" fill="url(#hero-accent)" stroke="none" />
  </g>

  <!-- Smoothness motif stage 6 -->
  <g transform="translate(140 326)" fill="none" stroke="url(#hero-accent)" stroke-width="1.3">
    <rect x="-22" y="-3" width="44" height="14" />
    <line x1="-12" y1="0" x2="-12" y2="11" />
    <line x1="0"   y1="0" x2="0"   y2="11" />
    <line x1="12"  y1="0" x2="12"  y2="11" />
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="url(#hero-accent)" font-weight="700">
    <text x="-18" y="6">2</text>
    <text x="-6"  y="6">3</text>
    <text x="6"   y="6">5</text>
  </g>

  <!-- Bottom: p, q -->
  <g transform="translate(0 0)">
    <line x1="160" y1="430" x2="260" y2="430" stroke="#A14A14" stroke-width="1.2" />
    <line x1="360" y1="430" x2="260" y2="430" stroke="#A14A14" stroke-width="1.2" />
  </g>
  <g transform="translate(160 460)">
    <rect x="-50" y="-22" width="100" height="44" rx="8" fill="#FFFFFF" stroke="#A14A14" stroke-width="1.4" />
    <text x="0" y="2" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="22" font-weight="500" fill="#1a1714">p = 89</text>
  </g>
  <g transform="translate(360 460)">
    <rect x="-50" y="-22" width="100" height="44" rx="8" fill="#FFFFFF" stroke="#A14A14" stroke-width="1.4" />
    <text x="0" y="2" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="22" font-weight="500" fill="#1a1714">q = 97</text>
  </g>
  <g transform="translate(260 460)">
    <text x="0" y="2" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6a604f">×</text>
  </g>

  <!-- Bottom signature -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1" fill="#92876f">
    <text x="40"  y="500">SEED 42 · OK</text>
    <text x="480" y="500" text-anchor="end" fill="#A14A14" font-weight="700">verified</text>
  </g>
</svg>
