title: tensift
tagline: Integer factorization via tensor-network Schnorr's sieving
description: >-
  tensift is a research-grade Rust implementation of a deterministic
  7-stage integer-factorization pipeline. Lattice construction, basis
  reduction, CVP approximation, tensor-network sampling, smoothness
  verification, and factor extraction — wired together as a single
  reproducible CLI tool and library.
author: Sachin
email: sachncs@gmail.com
url: https://sachncs.github.io
baseurl: /tensift
repository: sachncs/tensift
logo: /assets/logo.svg
favicon: /assets/favicon.svg
show_downloads: false
permalink: /:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false
  toc_levels: 2..3
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Brand and presentation
brand:
  name: tensift
  product_line: "open-source cryptography · systems software"
  paper: "M. Tesoro, I. Siloi, D. Jaschke, G. Magnifico, S. Montangero, Phys. Rev. A 113, 032418 (2026)"
  paper_doi: "https://doi.org/10.1103/PhysRevA.113.032418"
  palette:
    accent: "#b85c1c"
  stats:
    crates: 5
    unit_tests: 121
    integration_tests: 14
    benches: 4
    lines_of_rust: 12600
  msrv: "1.88"
  license: "MIT OR Apache-2.0"

# Files and directories that Jekyll should not copy into the built site.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - SECURITY.md
  - SUPPORT.md
  - CODE_OF_CONDUCT.md
  - CHANGELOG.md
  - LICENSE-MIT
  - LICENSE-APACHE
  - clippy.toml
  - deny.toml
  - justfile
  - setup.sh
  - rust-toolchain.toml
  - Cargo.toml
  - Cargo.lock
  - .editorconfig
  - .gitignore
  - .gitattributes
  - target
  - .github
  - .git
  - crates
  - "*.sh"
  - "*.toml"
  - "*.lock"
  - "*.yml"
  - "*.yaml"
  - vendor

include:
  - _pages

