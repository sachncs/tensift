---
layout: default
---

<article class="page docs-page">
  <header class="page-header">
    {% if page.section %}<p class="page-eyebrow">{{ page.section }}</p>{% endif %}
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
    {% if page.github_path %}
      <p class="docs-edit">
        <a href="{{ site.github_edit_base }}{{ page.github_path }}">Edit this page on GitHub →</a>
      </p>
    {% endif %}
  </header>

  <div class="page-body">
    {{ content }}
  </div>
</article>
