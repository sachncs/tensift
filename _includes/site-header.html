<header class="site-header" role="banner">
  <div class="site-header-inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      <img class="site-logo" src="{{ site.logo | relative_url }}" alt="" aria-hidden="true" />
      <span class="site-brand-text">
        <strong>{{ site.title }}</strong>
        <span class="site-tagline">{{ site.tagline }}</span>
      </span>
    </a>

    <nav class="site-quicknav" aria-label="Primary">
      <a href="{{ '/getting-started/' | relative_url }}">Get started</a>
      <a href="{{ '/tutorials/use-as-library/' | relative_url }}">Tutorials</a>
      <a href="{{ '/api/crate-map/' | relative_url }}">API</a>
      <a href="https://github.com/{{ site.repository }}" rel="noopener">GitHub ↗</a>
    </nav>
  </div>
</header>
