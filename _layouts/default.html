<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {%- feed_meta -%}
  {%- seo -%}
</head>
<body class="layout-{{ page.layout | default: 'default' }}">

<a class="skip-link" href="#main-content">Skip to main content</a>

{% include site-header.html %}

{% if page.layout == 'home' %}
  <main id="main-content" class="site-main site-main--wide" role="main">
    {{ content }}
  </main>
{% else %}
<div class="page-shell">
  {% include sidebar.html %}

  <main id="main-content" class="site-main" role="main">
    {{ content }}
  </main>
</div>
{% endif %}

{% include site-footer.html %}

</body>
</html>
