[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.1"
authors = ["Sachin <sachncs@gmail.com>"]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/sachncs/tensift"
repository = "https://github.com/sachncs/tensift"
documentation = "https://docs.rs/tensift"
keywords = ["tensift", "factorization", "semiprime", "lattice", "schnorr"]
categories = ["cryptography", "algorithms", "mathematics", "science"]

[workspace.dependencies]
# Core dependencies used across crates
rug = { version = "1.29", default-features = false, features = ["integer", "rational", "float"] }
ndarray = { version = "0.17", features = ["rayon"] }
num-traits = "0.2"
num-integer = "0.1"
rand = "0.10"
rand_chacha = "0.10"
thiserror = "2"
log = "0.4"
rayon = "1.10"
lll-rs = { version = "0.2.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"

# Dev dependencies
criterion = { version = "0.7", features = ["html_reports"] }
proptest = "1.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# panic=abort yields smaller binaries but disables unwinding/backtraces.
# This profile applies to every workspace crate, including libraries, so any
# panic inside `tensift_*` library code aborts the host process. Downstream
# callers who want to recover from a transient panic must wrap calls in
# `std::panic::catch_unwind`. See docs/08-implementation-notes.md for details.
panic = "abort"
# strip=symbols removes debug symbols from release builds to reduce size.
strip = "symbols"
